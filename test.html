<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with OpenAI</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #chat {
            width: 100%;
            height: 300px;
            border: 1px solid #ccc;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        #messageInput {
            width: 80%;
            padding: 10px;
        }
        #sendButton {
            padding: 10px;
            width: 18%;
        }
    </style>
</head>
<body>
<h1>Chat with OpenAI</h1>
<div id="chat"></div>
<input type="text" id="messageInput" placeholder="Type your message here...">
<button id="sendButton">Send</button>

<script>
    const socket = io("http://localhost:5000");

    // Replace with your user ID
    const userId = "user_123";

    // Subscribe to the WebSocket
    socket.emit("subscribe", { user_id: userId, type: "subscribe" });

    // Handle subscription acknowledgment
    socket.on("subscription_ack", (data) => {
        appendMessage(`Subscription successful for user: ${data.user_id}`);
    });

    // Handle incoming response chunks
    socket.on("response_chunk", (data) => {
        const chat = document.getElementById("chat");
        const lastMessage = chat.lastChild;
        if (lastMessage && lastMessage.textContent.startsWith("AI:")) {
            // Update the last AI message
            lastMessage.textContent = `AI: ${data.payload.text_chunk}`;
        } else {
            // Append a new AI message
            appendMessage(`AI: ${data.payload.text_chunk}`);
        }
    });

    // Handle errors
    socket.on("error", (data) => {
        appendMessage(`Error: ${data.payload.error}`);
    });

    // Send message when the send button is clicked
    document.getElementById("sendButton").addEventListener("click", () => {
        const messageInput = document.getElementById("messageInput");
        const message = messageInput.value.trim();
        if (message) {
            socket.emit("message", {
                user_id: userId,
                type: "message",
                payload: {
                    text: message
                }
            });
            appendMessage(`You: ${message}`);
            messageInput.value = "";
        }
    });

    // Append messages to the chat window
    function appendMessage(message) {
        const chat = document.getElementById("chat");
        const messageElement = document.createElement("div");
        messageElement.textContent = message;
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
